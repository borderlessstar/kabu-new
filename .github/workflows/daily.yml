name: 毎朝の株ニュース収集

on:
  schedule:
    # 00:17 JST に実行（GitHubの時刻はUTCなので 15:17 UTC = 翌00:17 JST）
    # ※GitHubの定時実行は混雑で3〜5時間遅れた実績があるため（9/28・9/29）、深夜0時台に前倒し。
    #   毎朝6:22のClaudeのブリーフィングより前に確実に終わらせるのが目的。
    - cron: "17 15 * * *"
  workflow_dispatch: {}   # 「Run workflow」ボタンで手動実行もできる
  push:                   # スクリプトや実行時刻を書き換えたら、その場で1回試し実行する
    branches: [main]
    paths: ["fetch_stocks.py", ".github/workflows/daily.yml"]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: ニュースを収集
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_stocks.py

      - name: 結果を保存（コミット）
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "update: $(TZ=Asia/Tokyo date +%Y-%m-%d)" || echo "変更なし"
          git push
